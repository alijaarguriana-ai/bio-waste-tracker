<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Bio Waste · Station</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #111; color: #fff;
         display: flex; flex-direction: column; user-select: none; }
  .bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; font-size: 15px; color: #bbb; }
  .bar b { color: #fff; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #777; margin-right: 6px; }
  .dot.on { background: #1baf7a; }
  .grid { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 0 12px 12px; }
  button { border: none; border-radius: 22px; color: #fff; font: inherit; cursor: pointer; display: flex; flex-direction: column;
           align-items: center; justify-content: center; gap: 10px; transition: transform .08s, filter .2s; touch-action: manipulation; }
  button:active { transform: scale(.97); }
  button .ico { font-size: 72px; line-height: 1; }
  button .de { font-size: 34px; font-weight: 800; }
  button .en { font-size: 18px; opacity: .85; }
  .prep { background: #2a78d6; } .spoiled { background: #d95926; } .plate { background: #15936a; }
  button.sent { filter: brightness(1.35); outline: 6px solid #fff; outline-offset: -6px; }
  button[disabled] { filter: grayscale(.6) brightness(.7); }
  .last { text-align: center; padding: 14px; font-size: 22px; min-height: 60px; background: #1d1d1d; }
  .last .w { font-size: 30px; font-weight: 800; }
  @media (max-width: 700px) { .grid { grid-template-columns: 1fr; } button .ico { font-size: 44px; } button .de { font-size: 26px; } }
</style>
</head>
<body>
  <div class="bar"><span><span class="dot" id="dot"></span>Station <b id="st">bin-01</b></span><span>1 tap · before or after tipping</span></div>
  <div class="grid">
    <button class="prep" data-type="preparation_waste"><span class="ico">🔪</span><span class="de">Zubereitung</span><span class="en">Prep / trimmings / over-production</span></button>
    <button class="spoiled" data-type="spoiled_stock"><span class="ico">🧊</span><span class="de">Verdorben</span><span class="en">Spoiled stock from storage</span></button>
    <button class="plate" data-type="plate_leftovers"><span class="ico">🍽️</span><span class="de">Tellerreste</span><span class="en">Plate leftovers from guests</span></button>
  </div>
  <div class="last" id="last">Waiting for the first disposal…</div>
<script>
const station = new URLSearchParams(location.search).get("station") || "bin-01";
document.getElementById("st").textContent = station;
const LABEL = { preparation_waste: "Zubereitung", spoiled_stock: "Verdorben", plate_leftovers: "Tellerreste" };
const last = document.getElementById("last");

document.querySelectorAll("button").forEach(b => b.addEventListener("click", async () => {
  const btns = document.querySelectorAll("button");
  btns.forEach(x => x.disabled = true);                // wet gloves double-tap guard
  b.classList.add("sent");
  if (navigator.vibrate) navigator.vibrate(60);
  try {
    const r = await fetch("/api/type-hint", { method: "POST", headers: { "Content-Type": "application/json" },
                                              body: JSON.stringify({ station_id: station, type: b.dataset.type }) });
    const j = await r.json();
    last.innerHTML = j.status === "applied"
      ? `✔ <span class="w">${Math.round(j.event.weight_g)} g</span> → ${LABEL[j.event.type]}`
      : `✔ ${LABEL[b.dataset.type]}, now tip the waste onto the tray`;
  } catch (e) { last.textContent = "⚠ No connection, use the buttons on the bin"; }
  setTimeout(() => { btns.forEach(x => x.disabled = false); b.classList.remove("sent"); }, 1200);
}));

let pinger = null;
function connect() {
  clearInterval(pinger);
  const ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws`);
  ws.onopen = () => document.getElementById("dot").classList.add("on");
  ws.onclose = () => { document.getElementById("dot").classList.remove("on"); setTimeout(connect, 2000); };
  ws.onmessage = m => {
    const d = JSON.parse(m.data);
    if ((d.type === "event" || d.type === "event_updated") && d.event.kind === "disposal" && d.event.station_id === station) {
      const by = d.event.type_source === "time_rule" ? " (auto, tap to correct)" : "";
      last.innerHTML = `✔ <span class="w">${Math.round(d.event.weight_g)} g</span> → ${LABEL[d.event.type]}${by}`;
    }
  };
  pinger = setInterval(() => ws.readyState === 1 && ws.send("ping"), 20000);
}
connect();
</script>
</body>
</html>
